# qraft-web: 回答者向け画面（Cloudflare Pages）。
# 画面が呼ぶ API の Origin は public/config.js と public/_headers の connect-src で指定する。
name = "qraft-web"
pages_build_output_dir = "public"
compatibility_date = "2026-07-29"

# 共有URL /q/<slug>（functions/q/[slug].js）が、OGP タグ用にクイズを取得する。
# 公開API（default エントリポイント）なので正解は含まれない。
[[services]]
binding = "API"
service = "qraft-api"
